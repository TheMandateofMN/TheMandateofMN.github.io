<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesserit</title>
    <meta name="description" content="Gesserit" />
    <!-- nothing on this page is fetched from anywhere but here, and nothing on it runs -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="same-origin" />
    <link rel="preload" href="assets/fonts/EBGaramond-Roman-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="assets/fonts/eb-garamond.css?v=1" />
    <!-- the palette names the colours; the stylesheet after it says what each is used for -->
    <link rel="stylesheet" href="assets/palette.css?v=1" />
    <link rel="stylesheet" href="styles.css?v=29" />
  </head>
  <body>
    <div class="page">
      <div class="border border--left" aria-hidden="true">
        <span class="vine-tip"></span>
        <span class="vine"></span>
        <span class="vine-tip vine-tip--foot"></span>
      </div>
      <div class="border border--right" aria-hidden="true">
        <span class="vine-tip"></span>
        <span class="vine"></span>
        <span class="vine-tip vine-tip--foot"></span>
      </div>

      <main class="folio">
        <h1 class="wordmark">
          <!-- Two layers of EB Garamond Initials: F1 is the ornament, F2 the letter -->
          <span class="initial" aria-hidden="true">
            <span class="initial__ornament">G</span>
            <span class="initial__letter">G</span>
          </span>
          <span class="wordmark__rest">esserit</span>
          <span class="visually-hidden">Gesserit</span>
        </h1>
      </main>

      <footer class="colophon">
        <span class="colophon__rule" aria-hidden="true"></span>
        <!-- the members' forum is a separate server on this subdomain; see server/ -->
        <a class="colophon__door" href="https://forum.gesserit.org/">Sign in</a>
      </footer>
    </div>
  </body>
</html>
